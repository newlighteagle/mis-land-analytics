<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIS Land Analytics</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.5 system-ui, sans-serif; height: 100vh; display: flex; }
  #map { flex: 1; }
  #panel { width: 380px; padding: 16px; overflow-y: auto; background: #fafafa; border-right: 1px solid #ddd; }
  h1 { font-size: 16px; margin-bottom: 12px; }
  input[type=search], input[type=text] { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  .modes { display: flex; gap: 4px; margin-bottom: 8px; }
  .modes button { flex: 1; background: #eee; color: #333; font-size: 13px; padding: 7px 0; }
  .modes button.active { background: #2d6a4f; color: #fff; }
  .hits { list-style: none; margin-top: 4px; }
  .hits li { padding: 7px 8px; cursor: pointer; border-radius: 4px; }
  .hits li:hover { background: #e8f0e8; }
  .hits .sub { color: #666; font-size: 12px; }
  .empty { color: #888; font-size: 12px; padding: 6px 8px; }
  .bar { height: 5px; background: #e4e4e4; border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #2d6a4f; }
  .pct { float: right; color: #2d6a4f; font-weight: 600; font-size: 12px; }
  .back { display: inline-block; margin-bottom: 8px; color: #2d6a4f; cursor: pointer; font-size: 13px; }
  .back:hover { text-decoration: underline; }
  #detail { margin-top: 16px; display: none; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
  dt { color: #666; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .card h2 { font-size: 14px; margin-bottom: 8px; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2d6a4f; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  input[type=number] { width: 80px; padding: 6px; border: 1px solid #bbb; border-radius: 6px; }
  .big { font-size: 28px; font-weight: 700; color: #2d6a4f; }
  .muted { color: #666; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; }
  #legend { position: absolute; top: 10px; right: 10px; z-index: 1; min-width: 210px;
            background: rgba(255,255,255,.94); border: 1px solid #ccc; border-radius: 8px;
            padding: 9px 11px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #legend h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
               color: #666; margin-bottom: 6px; font-weight: 600; }
  #legend label { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 2px 0; }
  #legend hr { border: 0; border-top: 1px solid #e0e0e0; margin: 8px 0 7px; }
  #legend .sw { width: 18px; height: 0; border-top-width: 3px; border-top-style: solid; }
  #legend .dot { width: 11px; height: 11px; border-radius: 50%; background: #00E5FF;
                 border: 1.5px solid #0b0b0b; margin: 0 4px; }
  /* popup titik pohon */
  .maplibregl-popup-content { padding: 0; border-radius: 10px; overflow: hidden;
                              box-shadow: 0 3px 14px rgba(0,0,0,.3); }
  .maplibregl-popup-close-button { color: #fff; font-size: 17px; right: 3px; top: 1px; }
  .pop-head { padding: 8px 12px; color: #0b0b0b; }
  .pop-no { display: block; font-size: 11px; opacity: .75; letter-spacing: .03em; }
  .pop-cat { font-size: 15px; font-weight: 700; }
  .pop-body { padding: 10px 12px 12px; }
  .pop-note { color: #555; font-size: 12px; margin-bottom: 8px; }
  .pop-row { display: flex; justify-content: space-between; font-size: 12px; }
  .pop-coord { color: #777; font-size: 11px; margin-top: 9px; }
</style>
</head>
<body>
<div id="panel">
  <h1>🌴 MIS Land Analytics</h1>
  <div class="modes">
    <button id="menuHasil" class="active">Hasil analisa</button>
    <button id="menuAnalisa">Analisa baru</button>
  </div>

  <!-- Menu 1: telusuri hasil per lembaga tani -->
  <div id="paneHasil">
    <div id="groupView">
      <input type="text" id="qGroup" placeholder="Cari lembaga tani…" autocomplete="off">
      <ul id="groupList" class="hits"><li class="empty">Memuat…</li></ul>
    </div>
    <div id="parcelView" hidden>
      <span class="back" id="backGroups">← Semua lembaga tani</span>
      <div id="groupHead"></div>
      <ul id="groupParcels" class="hits"></ul>
    </div>
  </div>

  <!-- Menu 2: pilih lahan yang belum dianalisa lalu jalankan analisa -->
  <div id="paneAnalisa" hidden>
    <input type="search" id="q" placeholder="Cari ID lahan atau nama petani…" autocomplete="off">
    <ul id="hits" class="hits"></ul>
  </div>

  <div id="detail">
    <dl id="attrs"></dl>
    <div class="card" id="summaryCard" hidden>
      <h2>Ringkasan pohon</h2>
      <div id="summary"></div>
    </div>
    <div class="card">
      <h2>Hasil analisa</h2>
      <div id="history" class="muted">Belum ada.</div>
    </div>
    <!-- alat analisa hanya tampil di menu "Analisa baru" -->
    <div id="tools" hidden>
      <div class="card">
        <h2>Tree count (baseline)</h2>
        <div>SPH <input type="number" id="sph" value="136" min="50" max="200"> pohon/ha
          <button id="run">Hitung</button></div>
        <div id="tcResult"></div>
      </div>
      <div class="card">
        <h2>Peta pohon (kisi tanam)</h2>
        <button id="runGrid">Petakan pohon dari citra</button>
        <div id="gridResult"></div>
      </div>
    </div>
  </div>
</div>
<div id="map"></div>
<div id="legend">
  <h3>Layer</h3>
  <label><input type="checkbox" id="lyrParcel" checked>
    <span class="sw" style="border-top-color:#ffd60a"></span> Batas lahan terpilih</label>
  <label><input type="checkbox" id="lyrDone" checked>
    <span class="sw" style="border-top-color:#4cc9f0"></span> Lahan teranalisa</label>
  <label><input type="checkbox" id="lyrTrees" checked>
    <span class="dot"></span> Titik pohon</label>
  <hr>
  <h3>Titik pohon</h3>
  <label><input type="checkbox" id="catSehat" checked>
    <span class="dot" style="background:#00E5FF"></span> Sehat <span class="muted" id="nSehat"></span></label>
  <label><input type="checkbox" id="catLemah" checked>
    <span class="dot" style="background:#FFD400"></span> Lemah <span class="muted" id="nLemah"></span></label>
  <label><input type="checkbox" id="catKosong" checked>
    <span class="dot" style="background:#FF1744"></span> Kosong / mati <span class="muted" id="nKosong"></span></label>
  <hr>
  <h3>Peta dasar</h3>
  <label><input type="radio" name="base" id="baseSat" checked> Satelit <span class="muted">(Google, 0,3 m)</span></label>
  <label><input type="radio" name="base" id="baseLight"> Terang</label>
  <label><input type="radio" name="base" id="baseDark"> Gelap</label>
</div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  center: [100.7, 0.82], zoom: 9,
  style: {
    version: 8,
    sources: {
      google: {
        type: 'raster', tileSize: 256, maxzoom: 21,
        tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
        attribution: 'Imagery © Google'
      },
      light: {
        type: 'raster', tileSize: 256, maxzoom: 20,
        tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],
        attribution: '© OpenStreetMap, © CARTO'
      },
      dark: {
        type: 'raster', tileSize: 256, maxzoom: 20,
        tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png'],
        attribution: '© OpenStreetMap, © CARTO'
      }
    },
    // ketiganya dimuat sekaligus dan dipilih lewat visibility, bukan ganti
    // style, supaya layer analisa di atasnya tidak perlu dibangun ulang
    layers: [
      { id: 'google', type: 'raster', source: 'google' },
      { id: 'light', type: 'raster', source: 'light', layout: { visibility: 'none' } },
      { id: 'dark', type: 'raster', source: 'dark', layout: { visibility: 'none' } },
    ]
  }
});
// kontrol zoom ditaruh di kanan bawah supaya tidak menutupi legenda di kanan atas
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

map.on('load', () => {
  // ikhtisar lahan teranalisa (biru) — digambar di bawah persil terpilih
  map.addSource('done', { type: 'geojson', data: empty() });
  // fill transparan — tidak terlihat, tapi tetap jadi target klik poligon
  map.addLayer({ id: 'done-fill', type: 'fill', source: 'done',
    paint: { 'fill-color': '#4cc9f0', 'fill-opacity': 0 } });
  map.addLayer({ id: 'done-line', type: 'line', source: 'done',
    paint: { 'line-color': '#4cc9f0', 'line-width': 1.8 } });
  map.on('click', 'done-fill', e => selectParcel(e.features[0].properties.id));
  map.on('mouseenter', 'done-fill', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'done-fill', () => map.getCanvas().style.cursor = '');

  map.addSource('parcel', { type: 'geojson', data: empty() });
  map.addLayer({ id: 'parcel-line', type: 'line', source: 'parcel',
    paint: { 'line-color': '#ffd60a', 'line-width': 2.5 } });

  map.addSource('trees', { type: 'geojson', data: empty() });
  map.addLayer({ id: 'trees', type: 'circle', source: 'trees',
    paint: {
      // warna dipilih berjauhan di roda warna supaya tetap terbaca di atas
      // citra yang didominasi hijau gelap
      'circle-color': ['match', ['get', 'category'],
        'sehat', '#00E5FF', 'lemah', '#FFD400', 'kosong', '#FF1744', '#00E5FF'],
      'circle-opacity': 0.95,
      // titik ikut membesar saat zoom in supaya tetap terbaca di skala persil
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 2, 17, 4, 20, 8],
      'circle-stroke-color': '#0b0b0b', 'circle-stroke-width': 1.4,
    } });
  map.on('click', 'trees', e => {
    const f = e.features[0], p = f.properties;
    const meta = {
      sehat:  ['#00E5FF', 'Sehat', 'Mahkota terdeteksi jelas dan rimbun'],
      lemah:  ['#FFD400', 'Lemah', 'Mahkota terdeteksi tapi lebih pucat dari sekitarnya'],
      kosong: ['#FF1744', 'Kosong / mati', 'Tidak ada mahkota di posisi tanam ini'],
    }[p.category] ?? ['#999', p.category ?? '-', ''];
    const pct = p.score != null ? Math.round(p.score * 100) : null;
    new maplibregl.Popup({ closeButton: true, maxWidth: '260px', offset: 12 })
      .setLngLat(f.geometry.coordinates)
      .setHTML(`
        <div class="pop">
          <div class="pop-head" style="background:${meta[0]}">
            <span class="pop-no">Pohon #${p.no}</span>
            <span class="pop-cat">${meta[1]}</span>
          </div>
          <div class="pop-body">
            <div class="pop-note">${meta[2]}</div>
            ${pct != null ? `
              <div class="pop-row"><span>Vigor mahkota</span><b>${pct}%</b></div>
              <div class="bar"><i style="width:${pct}%;background:${meta[0]}"></i></div>` : ''}
            <div class="pop-coord">📍 ${(+p.lat).toFixed(6)}, ${(+p.lon).toFixed(6)}</div>
          </div>
        </div>`)
      .addTo(map);
  });
  map.on('mouseenter', 'trees', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'trees', () => map.getCanvas().style.cursor = '');
  loadGroups();
  wireLegend();
});

// Legenda: kotak centang menyalakan/mematikan layer, radio memilih peta dasar
function wireLegend() {
  const groups = {
    lyrParcel: ['parcel-line'],
    lyrDone:   ['done-line', 'done-fill'],   // fill ikut mati agar klik tidak nyasar
    lyrTrees:  ['trees'],
  };
  for (const [box, layers] of Object.entries(groups)) {
    const apply = () => layers.forEach(l =>
      map.setLayoutProperty(l, 'visibility', $(box).checked ? 'visible' : 'none'));
    $(box).addEventListener('change', apply);
    apply();
  }
  for (const [, , , box] of CAT) $(box).addEventListener('change', applyCatFilter);
  applyCatFilter();

  const BASES = [['baseSat', 'google'], ['baseLight', 'light'], ['baseDark', 'dark']];
  const applyBase = () => BASES.forEach(([box, layer]) =>
    map.setLayoutProperty(layer, 'visibility', $(box).checked ? 'visible' : 'none'));
  BASES.forEach(([box]) => $(box).addEventListener('change', applyBase));
  applyBase();
}

// Saring titik menurut kategori supaya bisa melihat mis. hanya yang mati
function applyCatFilter() {
  const on = CAT.filter(([key, , , box]) => $(box).checked).map(([key]) => key);
  map.setFilter('trees', on.length
    ? ['in', ['get', 'category'], ['literal', on]]
    : ['==', ['get', 'category'], '__none__']);
}

const $ = id => document.getElementById(id);
const empty = () => ({ type: 'FeatureCollection', features: [] });
let currentPk = null, currentGroup = null, groups = [], timer = null;

// ---------- Menu ----------
for (const [btn, other, pane, otherPane] of [
  ['menuHasil', 'menuAnalisa', 'paneHasil', 'paneAnalisa'],
  ['menuAnalisa', 'menuHasil', 'paneAnalisa', 'paneHasil'],
]) {
  $(btn).addEventListener('click', () => {
    $(btn).classList.add('active');
    $(other).classList.remove('active');
    $(pane).hidden = false;
    $(otherPane).hidden = true;
    $('tools').hidden = btn !== 'menuAnalisa';   // alat analisa hanya di menu Analisa
    if (btn === 'menuHasil') loadGroups();
  });
}

// ---------- Menu "Hasil analisa": daftar lembaga tani ----------
async function loadGroups() {
  groups = await (await fetch('/api/groups')).json();
  renderGroups($('qGroup').value.trim().toLowerCase());
  if (currentGroup) showOverview(currentGroup.id, false);
}

function renderGroups(needle = '') {
  const rows = needle ? groups.filter(g => g.name.toLowerCase().includes(needle)) : groups;
  $('groupList').innerHTML = rows.length ? rows.map(g => `
    <li data-gid="${g.id}">
      <span class="pct">${g.pct}%</span><b>${g.name}</b><br>
      <span class="sub">${g.analyzed} / ${g.total} lahan teranalisa · ${g.total_area.toFixed(0)} ha</span>
      <span class="bar"><i style="width:${Math.max(g.pct, g.analyzed ? 1.5 : 0)}%"></i></span>
    </li>`).join('') : '<li class="empty">Tidak ada lembaga yang cocok.</li>';
}

$('qGroup').addEventListener('input', () => renderGroups($('qGroup').value.trim().toLowerCase()));

$('groupList').addEventListener('click', e => {
  const li = e.target.closest('li[data-gid]');
  if (li) openGroup(groups.find(g => g.id === li.dataset.gid));
});

$('backGroups').addEventListener('click', () => {
  currentGroup = null;
  $('parcelView').hidden = true;
  $('groupView').hidden = false;
  $('detail').style.display = 'none';
  currentPk = null;
  map.getSource('parcel').setData(empty());
  map.getSource('trees').setData(empty());
  showOverview(null, true);
});

async function openGroup(g) {
  if (!g) return;
  currentGroup = g;
  $('groupView').hidden = true;
  $('parcelView').hidden = false;
  $('groupHead').innerHTML = `<b>${g.name}</b><br>
    <span class="sub">${g.analyzed} dari ${g.total} lahan sudah dianalisa (${g.pct}%)</span>`;
  $('groupParcels').innerHTML = '<li class="empty">Memuat…</li>';
  const rows = await (await fetch(`/api/group/${encodeURIComponent(g.id)}/parcels?status=done`)).json();
  $('groupParcels').innerHTML = rows.length ? rows.map(r => {
    const hasil = r.trees_grid != null
      ? `🌴 ${r.trees_grid} pohon · ${r.sph_grid} SPH terukur`
      : `🌴 ${r.trees_baseline ?? '-'} pohon (baseline)`;
    return `<li data-pk="${r.id}"><b>${r.parcel_id}</b><br>
      <span class="sub">${r.farmer_name} · ${(+r.area).toFixed(2)} ha<br>${hasil}</span></li>`;
  }).join('') : '<li class="empty">Belum ada lahan yang dianalisa di lembaga ini.</li>';
  showOverview(g.id, true);
}

async function showOverview(gid, fit) {
  const url = gid ? `/api/analyzed/geojson?group=${encodeURIComponent(gid)}` : '/api/analyzed/geojson';
  const fc = await (await fetch(url)).json();
  map.getSource('done').setData(fc);
  if (!fit || !fc.features.length) return;
  const pts = fc.features.flatMap(f => f.geometry.coordinates.flat(f.geometry.type === 'MultiPolygon' ? 2 : 1));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  map.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]],
                { padding: 60, maxZoom: 15 });
}

// ---------- Menu "Analisa baru": cari lahan yang belum dianalisa ----------
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = $('q').value.trim();
    if (q.length < 3) { $('hits').innerHTML = ''; return; }
    const rows = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&status=new`)).json();
    $('hits').innerHTML = rows.length ? rows.map(r =>
      `<li data-pk="${r.id}"><b>${r.parcel_id}</b><br>
       <span class="sub">${r.farmer_name} · ${(+r.area).toFixed(2)} ha · ${r.crop_type ?? '-'}</span></li>`).join('')
      : '<li class="empty">Tidak ada lahan belum dianalisa yang cocok.</li>';
  }, 250);
});

for (const id of ['hits', 'groupParcels']) {
  $(id).addEventListener('click', e => {
    const li = e.target.closest('li[data-pk]');
    if (li) selectParcel(li.dataset.pk);
  });
}

// ---------- Detail satu lahan ----------
async function selectParcel(pk) {
  currentPk = pk;
  const f = await (await fetch(`/api/parcel/${pk}`)).json();
  const p = f.properties;
  $('detail').style.display = 'block';
  $('attrs').innerHTML = [
    ['ID lahan', p.parcel_id], ['Petani', p.farmer_name],
    ['Kelompok', p.farmer_group_name ?? '-'], ['Luas', (+p.area).toFixed(2) + ' ha'],
    ['Komoditas', p.crop_type ?? '-'], ['Status lahan', p.land_status ?? '-'],
    ['Blok', p.blok ?? '-'], ['PSR', p.is_psr ? 'Ya' : 'Tidak'],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  $('tcResult').innerHTML = '';
  $('gridResult').innerHTML = '';
  $('summaryCard').hidden = true;
  map.getSource('parcel').setData(f);
  loadTrees();
  const [minX, minY, maxX, maxY] = f.geometry.bbox ?? bboxOf(f.geometry);
  map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 60, maxZoom: 17 });
  loadHistory();
}

function bboxOf(g) {
  const pts = g.coordinates.flat(g.type === 'MultiPolygon' ? 2 : 1);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

async function loadHistory() {
  const rows = await (await fetch(`/api/parcel/${currentPk}/results`)).json();
  $('history').innerHTML = rows.length
    ? `<table><tr><th>Metode</th><th>Pohon</th><th>SPH</th><th>Conf</th><th>Kapan</th></tr>` +
      rows.map(r => `<tr><td>${r.method}</td><td>${r.tree_count}</td>
        <td>${r.sph_used ?? '-'}</td><td>${r.confidence}</td>
        <td>${r.computed_at.slice(0, 10)}</td></tr>`).join('') + '</table>'
    : 'Belum ada.';
}

const CAT = [
  ['sehat',  '#00E5FF', 'Sehat',         'catSehat',  'nSehat'],
  ['lemah',  '#FFD400', 'Lemah',         'catLemah',  'nLemah'],
  ['kosong', '#FF1744', 'Kosong / mati', 'catKosong', 'nKosong'],
];

async function loadTrees() {
  const fc = await (await fetch(`/api/parcel/${currentPk}/trees`)).json();
  map.getSource('trees').setData(fc);
  renderSummary(fc.features);
  return fc.features.length;
}

function renderSummary(features) {
  const count = c => features.filter(f => f.properties.category === c).length;
  for (const [key, , , , span] of CAT)
    $(span).textContent = features.length ? `(${count(key)})` : '';
  if (!features.length) { $('summaryCard').hidden = true; return; }
  $('summaryCard').hidden = false;
  const n = features.length;
  $('summary').innerHTML = `<div class="big">${n.toLocaleString('id')} pohon</div>` +
    CAT.map(([key, color, label]) => {
      const k = count(key), pct = (k / n * 100).toFixed(1);
      return `<div style="margin-top:6px">
        <span class="dot" style="background:${color};display:inline-block;width:10px;height:10px;
              border-radius:50%;margin-right:6px"></span>${label}
        <b style="float:right">${k} <span class="muted">(${pct}%)</span></b>
        <span class="bar"><i style="width:${pct}%;background:${color}"></i></span></div>`;
    }).join('') +
    `<div class="muted" style="margin-top:8px">Kategori dari kehijauan mahkota, <b>relatif</b>
     antar pohon di lahan ini — bukan diagnosis penyakit. Klik titik di peta untuk detail.</div>`;
}

// ---------- Menjalankan analisa (hanya dari menu "Analisa baru") ----------
$('runGrid').addEventListener('click', async () => {
  if (!currentPk) return;
  $('runGrid').disabled = true;
  $('gridResult').innerHTML = '<div class="muted">Mengambil citra & mengukur pola tanam…</div>';
  try {
    const res = await fetch(`/api/parcel/${currentPk}/analyze/tree-grid`, { method: 'POST' });
    const r = await res.json();
    if (!res.ok) {
      $('gridResult').innerHTML = `<div class="muted">⚠️ ${r.detail ?? 'Gagal'}</div>`;
      return;
    }
    const p = r.params;
    const warn = p.warnings?.length
      ? `<div class="muted">⚠️ ${p.warnings.join('; ')} — periksa dulu sebelum dipakai.</div>` : '';
    $('gridResult').innerHTML = `<div class="big">${r.tree_count.toLocaleString('id')} titik pohon</div>
      <div class="muted">jarak tanam ${p.spacing_a1_m} × ${p.spacing_a2_m} m · arah baris ${p.row_angle_deg}° ·
      ${p.sph_from_lattice} SPH terukur · citra z${p.zoom} (${p.meters_per_pixel} m/px)</div>${warn}
      <div class="muted" style="margin-top:6px">Posisi <b>model</b> dari kisi tanam terukur, bukan deteksi tiap pohon.</div>`;
    await loadTrees();
    loadHistory();
  } finally { $('runGrid').disabled = false; }
});

$('run').addEventListener('click', async () => {
  if (!currentPk) return;
  $('run').disabled = true;
  try {
    const r = await (await fetch(`/api/parcel/${currentPk}/analyze/tree-count`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sph: +$('sph').value || null })
    })).json();
    $('tcResult').innerHTML = `<div class="big">± ${r.tree_count.toLocaleString('id')} pohon</div>
      <div class="muted">${r.area_ha.toFixed(2)} ha × ${r.sph_used} SPH · metode ${r.model_version} ·
      confidence ${r.confidence}</div>`;
    loadHistory();
  } finally { $('run').disabled = false; }
});
</script>
</body>
</html>
